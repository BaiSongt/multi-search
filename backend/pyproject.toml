[project]
name = "multisearch"
version = "0.3.0a7"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "ddgs==9.16.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "mcp==2.3.0",
    "protego==0.7.0",
    "pydantic==2.14.3",
    "pypdf==6.21.4",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
