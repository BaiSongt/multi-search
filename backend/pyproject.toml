[project]
name = "multisearch"
version = "0.1.0a1"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "ddgs==9.16.1",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "redis==8.1.0",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
