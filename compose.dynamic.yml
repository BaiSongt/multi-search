services:
  multisearch-api:
    environment:
      MULTISEARCH_DYNAMIC_FETCH_DOMAINS: ${MULTISEARCH_DYNAMIC_FETCH_DOMAINS:-}

  multisearch-worker:
    profiles: [fetch, research, dynamic]
    environment:
      MULTISEARCH_DYNAMIC_FETCH_DOMAINS: ${MULTISEARCH_DYNAMIC_FETCH_DOMAINS:-}
      MULTISEARCH_ENABLE_DYNAMIC_FETCH: ${MULTISEARCH_ENABLE_DYNAMIC_FETCH:-true}
      MULTISEARCH_DYNAMIC_FETCH_RESOURCES: ${MULTISEARCH_DYNAMIC_FETCH_RESOURCES:-}
      MULTISEARCH_RENDERER_TOKEN_FILE: /run/secrets/renderer_token
    secrets: [renderer_token]
    volumes:
      - type: volume
        source: renderer_socket
        target: /run/multisearch-renderer
        read_only: true
        volume:
          nocopy: true

  crawl4ai:
    profiles: [fetch, research, dynamic]

  renderer:
    profiles: [dynamic]
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/renderer/Dockerfile
    environment:
      MULTISEARCH_RENDERER_TOKEN_FILE: /run/secrets/renderer_token
    secrets: [renderer_token]
    volumes:
      - type: volume
        source: renderer_socket
        target: /run/multisearch-renderer
        volume:
          nocopy: true
    network_mode: none
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/renderer/seccomp.json
    tmpfs: ["/tmp:size=128m,noexec,nosuid,nodev"]
    shm_size: 96m
    mem_limit: 640m
    pids_limit: 256
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "app.py", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  renderer_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "mode=0700,uid=1000,gid=1000,size=1m,nosuid,nodev,noexec"

secrets:
  renderer_token:
    file: ./.secrets/renderer_token
